# For the host's own X server (e.g. lightdm's), in /etc/X11/xorg.conf.d/: do not take GPUs that appear while it runs.
# Without it that server adds fpgagpu's card as a GPU screen and holds its DRM master, so no other client (an X server
# for the board, modetest, the console) can set a mode on it.
Section "ServerFlags"
	Option	"AutoAddGPU"	"false"
EndSection
