# /etc/systemd/system/lightdm.service.d/fpgagpu.conf: LightDM waits up to 10 s for the boards' display card before it
# starts (fpgagpu loads at boot and greets board A every few seconds), so X starts on the boards when they are on.
# Without them X starts on the machine's own display; 99-fpgagpu-display.rules restarts it once board A answers
[Service]
ExecStartPre=/bin/sh -c 'for i in $$(seq 1 20); do ls /sys/bus/platform/devices/fpgagpu/drm 2>/dev/null | grep -q "^card" && exit 0; sleep 0.5; done; exit 0'
