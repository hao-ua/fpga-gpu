# /etc/lightdm/lightdm.conf.d/50-fpgagpu.conf: LightDM logs the VM's user straight into XFCE (its password is locked,
# and the login screen would have no keyboard before the session's Deskflow client starts). X itself is configured by
# 20-fpgagpu.conf: on the FPGA GPU whenever the fpgagpu module is loaded.
[Seat:*]
autologin-user=debian
autologin-user-timeout=0
autologin-session=xfce
user-session=xfce
