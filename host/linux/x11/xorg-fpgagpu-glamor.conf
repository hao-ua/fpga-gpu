# X on the FPGA GPU with glamor: the modesetting driver renders through Mesa's fpgagpu driver (OpenGL ES 2.0) on the
# boards, into a GBM buffer that is board B's scanout image itself (fpgagpu_kms.c shows it without a copy).
#   LD_LIBRARY_PATH=<the fpgagpu Mesa's libdir> Xorg :1 -config /path/to/xorg-fpgagpu-glamor.conf ...
# (start-x-fpgagpu.sh start glamor does that). No input devices: the boards have none.

Section "ServerFlags"
	Option	"AutoAddGPU"		"false"
	Option	"AutoAddDevices"	"false"
	Option	"AutoEnableDevices"	"false"
	Option	"BlankTime"		"0"
	Option	"StandbyTime"		"0"
	Option	"SuspendTime"		"0"
	Option	"OffTime"		"0"
EndSection

Section "Device"
	Identifier	"fpgagpu"
	Driver		"modesetting"
	Option		"kmsdev"	"/dev/dri/card1"
	Option		"AccelMethod"	"glamor"
	Option		"PageFlip"	"off"
EndSection

Section "Monitor"
	Identifier	"board-b-hdmi"
EndSection

Section "Screen"
	Identifier	"fpgagpu-screen"
	Device		"fpgagpu"
	Monitor		"board-b-hdmi"
	DefaultDepth	24
	SubSection "Display"
		Depth	24
		Modes	"800x600"
	EndSubSection
EndSection
