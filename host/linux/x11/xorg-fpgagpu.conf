# X on the FPGA GPU: a server that drives only fpgagpu's KMS output (board B's HDMI).
#   Xorg :1 -config /path/to/xorg-fpgagpu.conf -configdir /path/to/empty-dir -nolisten tcp -noreset
# The modesetting driver renders in software (no glamor until the Mesa driver exists) into dumb buffers; every change
# reaches the board as the plane's damage (fpgagpu_kms.c: WRITE_IMAGE of the changed rectangle).
# No input devices: the boards have none, and the host's own belong to its own X server.

Section "ServerFlags"
	Option	"AutoAddGPU"		"false"
	Option	"AutoAddDevices"	"false"
	Option	"AutoEnableDevices"	"false"
	Option	"BlankTime"		"0"
	Option	"StandbyTime"		"0"
	Option	"SuspendTime"		"0"
	Option	"OffTime"		"0"
EndSection

Section "Device"
	Identifier	"fpgagpu"
	Driver		"modesetting"
	Option		"kmsdev"	"/dev/dri/card1"
	Option		"AccelMethod"	"none"
	Option		"PageFlip"	"off"
EndSection

Section "Monitor"
	Identifier	"board-b-hdmi"
EndSection

Section "Screen"
	Identifier	"fpgagpu-screen"
	Device		"fpgagpu"
	Monitor		"board-b-hdmi"
	DefaultDepth	24
	SubSection "Display"
		Depth	24
		Modes	"800x600"
	EndSubSection
EndSection
