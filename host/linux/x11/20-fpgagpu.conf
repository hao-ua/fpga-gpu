# /etc/X11/xorg.conf.d/20-fpgagpu.conf: an X server started by a display manager (GDM) runs on the FPGA GPU whenever
# the fpgagpu module is loaded. Its card becomes the primary GPU, X renders with glamor through the fpgagpu Mesa driver
# (which must be the system's GL, see LINUX.md) and shows on board B's HDMI. No other card is added as a second GPU.
# Without the module this section matches nothing and X runs on the machine's own display as before.

# No blanking: X's screen saver and DPMS would switch board B's output off and on again (a modeset each time).
Section "ServerFlags"
	Option		"AutoAddGPU"	"false"
	Option		"BlankTime"	"0"
	Option		"StandbyTime"	"0"
	Option		"SuspendTime"	"0"
	Option		"OffTime"	"0"
EndSection

# No MIT-SHM: glamor keeps a shared-memory pixmap in host memory and uploads it again for every operation that reads
# it, which over the boards' network link is about 2 MB a time for a screen-sized one (GTK 3 and cairo hand images to X
# this way). Without the extension clients send ordinary pixmaps, uploaded once and kept on the boards.
Section "Extensions"
	Option		"MIT-SHM"	"Disable"
EndSection

Section "OutputClass"
	Identifier	"fpgagpu"
	MatchDriver	"fpgagpu"
	Driver		"modesetting"
	Option		"PrimaryGPU"	"yes"
	Option		"AccelMethod"	"glamor"
	Option		"PageFlip"	"off"
EndSection
