# /etc/X11/xorg.conf.d/20-fpgagpu.conf: an X server started by a display manager (GDM) runs on the FPGA GPU whenever
# the fpgagpu module is loaded. Its card becomes the primary GPU, X renders with glamor through the fpgagpu Mesa driver
# (which must be the system's GL, see LINUX.md) and shows on board B's HDMI. No other card is added as a second GPU.
# Without the module this section matches nothing and X runs on the machine's own display as before.

Section "ServerFlags"
	Option		"AutoAddGPU"	"false"
EndSection

Section "OutputClass"
	Identifier	"fpgagpu"
	MatchDriver	"fpgagpu"
	Driver		"modesetting"
	Option		"PrimaryGPU"	"yes"
	Option		"AccelMethod"	"glamor"
	Option		"PageFlip"	"off"
EndSection
